<html>
    <body style="display: flexbox; justify-content: center; justify-items: center;">
        <div style="text-align: center;">
            <img id="icon"/>
            <h1>The Server Rizzysigma84.aternos.me is currently:</h1>
        </div>
        <div id="line?" style="width: fit-content;height: fit-content;font-size: 500%;">Fetching...</div>
        <div style="background-color: black;width: 100%;height: 2px;"></div>
        <div style="text-align: center; font-size: xx-large;">Players Online: <span id="players">Fetching...</span></div>
        <ul id="playerlist" style="list-style-type: none;margin: 0;padding: 0;"></ul>
        <div style="background-color: black;width: 100%;height: 2px;"></div>
        <div style="text-align: center; font-size: xx-large;">Server Info</div>
        <div id=""></div>
        <script>
            var line = document.getElementById("line?");
            var players = document.getElementById("players");
            var playerlist = document.getElementById("playerlist");
            var icon = document.getElementById("icon");
            
            var req = new XMLHttpRequest();
            req.open('GET', 'https://api.mcsrvstat.us/3/rizzysigma84.aternos.me',true);
            req.onload = function() {
                if (req.status >= 200 && req.status < 400) {
                    var data = JSON.parse(req.responseText);
                    if(!data.version.includes("Offline")) {
                        line.innerHTML = "Online";
                        line.style.backgroundColor = "lightgreen";
                        players.innerHTML = data.players.online + "/" + data.players.max;
                        console.log(data.players.online);
                        data.players.list.forEach(player => {
                            var newli = document.createElement("li");
                            newli.innerHTML = player.name;
                            newli.style.border = "2px solid black";
                            newli.style.fontSize = "x-large";
                            playerlist.appendChild(newli);
                        });
                    } else {
                        line.innerHTML = "Offline";
                        line.style.backgroundColor = "lightcoral";
                        players.innerHTML = "Offline";
                        var message = document.createElement("li");
                        message.innerHTML = "The Server is Offline";
                        playerlist.appendChild(message);
                    }
                    icon.src = data.icon;
                } else {
                    document.write("Error: Unable to reach the server status API.");
                }
            }
            req.send();
        </script>
    </body>

</html>
